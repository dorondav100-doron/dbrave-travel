<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D Brave Travel | עבודה מהבית ומכל מקום בעולם</title>
<meta name="description" content="D Brave Travel מגייסת סוכני מכירות מהבית. לוח בקרה, תוכנת מלונות עם מעל 40,000 מלונות במחירים מתחת לבוקינג ותוכנת טיסות. שעה פנויה ביום. 050-8472828">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Heebo:wght@400;700;900&family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#1475BC;
  --sky-deep:#0B4F82;
  --sky-tint:#EAF3FB;
  --sky-line:#C7DFF1;
  --sun:#FBBD14;
  --sun-soft:#FFE9A8;
  --ink:#0E2F4A;
  --slate:#587D99;
  --white:#FFFFFF;
  --r:26px; /* porthole radius */
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background:var(--white);color:var(--ink);
  font-family:"Assistant",system-ui,sans-serif;font-weight:400;
  line-height:1.7;overflow-x:hidden;
}
h1,h2,h3,.disp{font-family:"Secular One",sans-serif;font-weight:400;line-height:1.12;letter-spacing:-.01em}
.num{font-family:"Heebo",sans-serif;font-weight:900;direction:ltr;letter-spacing:-.02em}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
a{color:inherit;text-decoration:none}
img,svg{display:block;max-width:100%}

/* ============ porthole shape (brand signature) ============ */
.hole{border-radius:50% / 14%;}
.window{
  position:relative;border-radius:44% 44% 44% 44% / 22% 22% 22% 22%;
  overflow:hidden;background:var(--sky);
}

/* ============ header ============ */
header.bar{
  position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);
  backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--sky-line);
}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:11px}
.logo{display:flex;align-items:center;gap:11px;min-width:0}
.logo .mk{width:44px;height:44px;flex:none;border-radius:50%;overflow:hidden}
.logo .mk img{width:100%;height:100%;object-fit:cover}
.logo b{font-family:"Secular One";font-size:20px;color:var(--sky);display:block;line-height:1}
.logo small{font-size:11px;color:var(--slate);letter-spacing:.02em}
.bar .call{
  margin-inline-start:auto;background:var(--sun);color:var(--ink);
  font-family:"Heebo";font-weight:900;font-size:14.5px;padding:9px 15px;border-radius:999px;
  white-space:nowrap;transition:transform .2s,box-shadow .2s;
}
.bar .call:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(251,189,20,.45)}

/* ============ hero ============ */
.hero{position:relative;padding:34px 0 54px;overflow:hidden}
.hero::before{
  content:"";position:absolute;inset-inline:-10%;top:-320px;height:640px;z-index:-2;
  background:radial-gradient(closest-side,rgba(20,117,188,.13),transparent 70%);
}
.hero-grid{display:grid;gap:34px;align-items:center}
.kicker{
  display:inline-flex;align-items:center;gap:8px;background:var(--sky-tint);color:var(--sky);
  font-weight:700;font-size:13.5px;letter-spacing:.02em;padding:7px 14px;border-radius:999px;
  border:1px solid var(--sky-line);margin-bottom:16px;
}
.kicker i{width:7px;height:7px;border-radius:50%;background:var(--sun);display:block;animation:blip 2.4s ease-in-out infinite}
@keyframes blip{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
h1{font-size:clamp(33px,8.6vw,60px);color:var(--ink)}
h1 .hl{position:relative;color:var(--sky);white-space:nowrap}
.hl::after{
  content:"";position:absolute;inset-inline:-2px;bottom:.06em;height:.32em;background:var(--sun-soft);
  z-index:-1;border-radius:3px;transform-origin:right center;animation:swipe .9s .5s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes swipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.sub{margin-top:18px;font-size:clamp(16.5px,4.3vw,19.5px);color:#3D6480;max-width:36ch}
.cta{display:flex;flex-wrap:wrap;gap:11px;margin-top:26px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  font-family:"Heebo";font-weight:900;font-size:17px;padding:16px 26px;border-radius:999px;
  transition:transform .2s,box-shadow .2s,background .2s;
}
.btn svg{width:19px;height:19px;fill:currentColor;flex:none}
.btn-p{background:var(--sky);color:#fff;box-shadow:0 10px 24px rgba(20,117,188,.3)}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(20,117,188,.42)}
.btn-s{background:#fff;color:var(--sky);border:1.5px solid var(--sky-line)}
.btn-s:hover{background:var(--sky-tint);transform:translateY(-2px)}
.tagline{margin-top:20px;color:var(--sky);font-family:"Secular One";font-size:17px}

/* hero art */
.art{position:relative;justify-self:center;width:min(340px,86vw)}
.art .window{
  aspect-ratio:1/1.22;box-shadow:0 26px 60px rgba(11,79,130,.28);
  border:9px solid #fff;outline:1px solid var(--sky-line);
}
.art .float{animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.rays{transform-origin:50% 62%;animation:spin 44s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.road{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 2.4s .3s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.plane{offset-path:path("M 20 150 C 70 120, 130 105, 180 62");offset-rotate:auto;animation:fly 6s 1s ease-in-out infinite}
@keyframes fly{0%{offset-distance:0%;opacity:0}12%{opacity:1}88%{opacity:1}100%{offset-distance:100%;opacity:0}}
.badge{
  position:absolute;background:#fff;border-radius:16px;padding:11px 15px;
  box-shadow:0 12px 30px rgba(11,79,130,.18);border:1px solid var(--sky-line);
  display:flex;align-items:center;gap:9px;font-weight:700;font-size:13.5px;
}
.badge .n{font-family:"Heebo";font-weight:900;color:var(--sky);font-size:17px;direction:ltr}
.badge.b1{inset-inline-start:-14px;top:16%;animation:float 6s ease-in-out infinite}
.badge.b2{inset-inline-end:-10px;bottom:12%;animation:float 6s .8s ease-in-out infinite}

/* ============ marquee band ============ */
.band{background:var(--sky);color:#fff;overflow:hidden;padding:13px 0;white-space:nowrap}
.band .row{display:inline-block;animation:slide 30s linear infinite}
.band span{display:inline-block;padding-inline-end:34px;font-family:"Secular One";font-size:15px;opacity:.95}
.band span::before{content:"✦";color:var(--sun);padding-inline-end:34px}
@keyframes slide{from{transform:translateX(-50%)}to{transform:translateX(0)}}

/* ============ sections ============ */
section{padding:62px 0}
.blue{background:var(--sky);color:#fff}
.tint{background:var(--sky-tint)}
.eyebrow{
  display:block;color:var(--sky);font-weight:700;font-size:13px;letter-spacing:.16em;margin-bottom:12px;
}
.blue .eyebrow{color:var(--sun)}
h2{font-size:clamp(27px,6.8vw,42px);margin-bottom:12px}
.lead{font-size:17px;color:#3D6480;max-width:54ch}
.blue .lead{color:#D8EAF7}

/* tool cards with porthole icons */
.tools{display:grid;gap:16px;margin-top:34px}
.tool{
  background:#fff;border:1px solid var(--sky-line);border-radius:22px;padding:26px 22px;
  transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s;
}
.tool:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(11,79,130,.14)}
.tool .win{
  width:64px;height:78px;background:var(--sky);border-radius:44% 44% 44% 44% / 22% 22% 22% 22%;
  display:grid;place-items:center;margin-bottom:16px;
}
.tool .win svg{width:32px;height:32px;fill:var(--sun)}
.tool h3{font-size:21px;margin-bottom:6px;color:var(--ink)}
.tool p{font-size:15.5px;color:#4A6E88}

/* ============ price gap (signature) ============ */
.gap{margin-top:34px;background:#fff;border-radius:26px;padding:26px 22px;box-shadow:0 20px 50px rgba(11,79,130,.16)}
.vs{display:grid;gap:22px}
.pr .who{font-weight:700;font-size:14px;color:var(--slate);display:flex;justify-content:space-between;align-items:baseline}
.pr .who b{font-family:"Heebo";font-weight:900;font-size:clamp(24px,7vw,34px);color:var(--ink);direction:ltr}
.pr .track{height:16px;background:var(--sky-tint);border-radius:999px;margin-top:9px;overflow:hidden}
.pr .fill{height:100%;width:0;border-radius:999px;transition:width 1.3s cubic-bezier(.2,.8,.2,1)}
.pr.them .fill{background:#B9CEDD}
.pr.us .who b{color:var(--sky)}
.pr.us .fill{background:linear-gradient(90deg,var(--sun),#F0A800)}
.saved{
  margin-top:20px;background:var(--sun);color:var(--ink);border-radius:16px;padding:14px 18px;
  display:flex;align-items:center;gap:12px;font-family:"Secular One";font-size:clamp(16px,4.6vw,21px);
}
.saved .num{font-size:1.25em}
.fineprint{font-size:12.5px;color:var(--slate);margin-top:16px;max-width:62ch}
.blue .fineprint{color:#B9D6EC}

/* ============ income ============ */
.inc{display:grid;gap:16px;margin-top:32px}
.inc div{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);border-radius:22px;
  padding:26px 20px;text-align:center;backdrop-filter:blur(4px);
}
.inc b{display:block;font-family:"Heebo";font-weight:900;font-size:clamp(34px,10vw,54px);color:var(--sun);direction:ltr}
.inc span{font-size:15px;color:#E2F0FA}

/* ============ checklist ============ */
.checks{margin-top:30px;display:grid;gap:12px}
.checks div{display:flex;gap:13px;align-items:flex-start;background:#fff;border:1px solid var(--sky-line);border-radius:16px;padding:15px 17px}
.checks .tick{
  width:26px;height:32px;flex:none;background:var(--sky);border-radius:44% 44% 44% 44% / 22% 22% 22% 22%;
  display:grid;place-items:center;
}
.checks .tick svg{width:14px;height:14px;fill:var(--sun)}
.checks p{font-size:16px;color:#2C5471}

/* ============ form ============ */
.card{
  max-width:560px;margin:34px auto 0;background:#fff;border-radius:28px;overflow:hidden;
  box-shadow:0 26px 60px rgba(11,79,130,.2);border:1px solid var(--sky-line);
}
.card-top{background:var(--sky);color:#fff;padding:20px 24px;display:flex;align-items:center;gap:12px}
.card-top .mk{width:40px;height:40px;flex:none;border-radius:50%;overflow:hidden}
.card-top .mk img{width:100%;height:100%;object-fit:cover}
.card-top b{font-family:"Secular One";font-size:18px;display:block;line-height:1.15}
.card-top small{font-size:12px;color:#CFE6F6}
.card-body{padding:24px 22px 26px}
.field{margin-bottom:15px}
.field label{display:block;font-weight:700;font-size:13.5px;color:#456A85;margin-bottom:6px}
.field input,.field select{
  width:100%;padding:14px 15px;font-family:"Assistant";font-size:16px;color:var(--ink);
  border:1.5px solid var(--sky-line);border-radius:13px;background:#FAFDFF;transition:border-color .2s,box-shadow .2s;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 4px rgba(20,117,188,.14)}
.send{
  width:100%;border:0;cursor:pointer;background:var(--sun);color:var(--ink);
  font-family:"Heebo";font-weight:900;font-size:18px;padding:17px;border-radius:999px;
  transition:transform .2s,box-shadow .2s;
}
.send:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(251,189,20,.5)}
.hint{text-align:center;font-size:13px;color:var(--slate);margin-top:12px}

/* ============ final ============ */
.final{text-align:center}
.final h2{color:#fff}
.contact{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:24px}
.phone{
  font-family:"Heebo";font-weight:900;font-size:clamp(30px,9vw,48px);color:var(--sun);direction:ltr;
  display:inline-block;transition:transform .2s;
}
.phone:hover{transform:scale(1.03)}
.mail{color:#DCEDF8;font-size:16px;direction:ltr;border-bottom:1px solid rgba(255,255,255,.4);padding-bottom:2px}
footer{background:var(--sky-deep);color:#BBD8EC;text-align:center;padding:26px 0 84px;font-size:13.5px}
footer b{font-family:"Secular One";color:#fff;font-size:16px;display:block;margin-bottom:4px}

/* ============ sticky mobile ============ */
.dock{position:fixed;inset-inline:0;bottom:0;z-index:60;display:flex;gap:1px;box-shadow:0 -6px 20px rgba(11,79,130,.18)}
.dock a{flex:1;text-align:center;padding:15px 6px;font-family:"Heebo";font-weight:900;font-size:15.5px}
.dock .w{background:var(--sun);color:var(--ink)}
.dock .c{background:var(--sky);color:#fff}
@media(min-width:900px){.dock{display:none}footer{padding-bottom:26px}}

/* ============ reveal ============ */
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.1s}.rv.d2{transition-delay:.2s}.rv.d3{transition-delay:.3s}

@media(min-width:900px){
  section{padding:88px 0}
  .hero{padding:56px 0 80px}
  .hero-grid{grid-template-columns:1.05fr .95fr;gap:50px}
  .art{width:400px}
  .tools{grid-template-columns:repeat(3,1fr);gap:20px}
  .vs{grid-template-columns:1fr 1fr;gap:28px}
  .inc{grid-template-columns:1fr 1fr;gap:20px}
  .checks{grid-template-columns:1fr 1fr}
  .gap{padding:34px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .rv{opacity:1;transform:none}
  .road{stroke-dashoffset:0}
  .hl::after{transform:none}
  html{scroll-behavior:auto}
}
</style>
</head>
